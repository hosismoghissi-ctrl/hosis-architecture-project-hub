name: Validate Hosis changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --check app.js && npm run build
      - name: Browser tests
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/hosis-http.log 2>&1 &
          npm run test:e2e
      - name: Save visual review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosis-visual-review
          path: test-results/
          retention-days: 7
